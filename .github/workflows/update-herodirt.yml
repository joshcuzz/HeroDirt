
name: Hero Dirt San Gabriels Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: herodirt-pages
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: HeroDirt/web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: HeroDirt/web/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/HeroDirt/web/requirements.txt"

      - name: Prepare model directory
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$HOME/HeroDirt"
          REPO="$GITHUB_WORKSPACE/HeroDirt/web"

          mkdir -p "$ROOT/src"
          mkdir -p "$ROOT/static"
          mkdir -p "$ROOT/data/osm"
          mkdir -p "$ROOT/output"

          cp "$REPO"/src/*.py "$ROOT/src/"
          cp -R "$REPO/static/." "$ROOT/static/"

          gzip -dc \
            "$REPO/data/osm/SanGabriels_all_trails_overpass.json.gz" \
            > "$ROOT/data/osm/SanGabriels_all_trails_overpass.json"

          # Site builders write into ~/HeroDirt/web
          mkdir -p "$ROOT/web/data"

      - name: Configure NASA Earthdata
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          user = os.environ["EARTHDATA_USERNAME"]
          password = os.environ["EARTHDATA_PASSWORD"]

          if not user or not password:
              raise RuntimeError("Missing NASA Earthdata credentials")

          path = Path.home() / ".netrc"
          path.write_text(
              f"machine urs.earthdata.nasa.gov\n"
              f"  login {user}\n"
              f"  password {password}\n"
          )
          path.chmod(0o600)
          PY

      - name: Checkout persistent MRMS history
        uses: actions/checkout@v4
        with:
          ref: mrms-history
          path: mrms-history
          persist-credentials: true

      - name: Restore MRMS hourly archive
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/mrms-history/mrms/HeroDirt_MRMS_hourly.npz"
          DEST="$HOME/HeroDirt/data/mrms/processed/HeroDirt_MRMS_hourly.npz"

          test -s "$SRC"
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"

          echo "Restored persistent MRMS history:"
          ls -lh "$DEST"



      - name: Download MRMS
        run: python "$HOME/HeroDirt/src/get_mrms.py"

      - name: Save persistent MRMS history
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_WORKSPACE/mrms-history"
          SOURCE="$HOME/HeroDirt/data/mrms/processed/HeroDirt_MRMS_hourly.npz"
          DEST="$REPO/mrms/HeroDirt_MRMS_hourly.npz"

          test -s "$SOURCE"

          # Verify the new archive before publishing it.
          python - "$SOURCE" <<'PY'
          import sys
          import numpy as np

          with np.load(sys.argv[1]) as m:
              t = m["time"].astype("datetime64[s]")
              p = m["precip_mm"]

              assert len(t) > 0, "Empty MRMS archive"
              assert p.shape[0] == len(t), "Time/grid mismatch"
              assert np.all(np.diff(t) > np.timedelta64(0, "s")), "Invalid time ordering"
              assert np.all(np.isfinite(p)), "Nonfinite precipitation"
              assert np.all(p >= 0), "Negative precipitation"

              print("MRMS archive validated")
              print("First:", t[0])
              print("Last: ", t[-1])
              print("Hours:", len(t))
          PY

          cp "$SOURCE" "$DEST"

          git -C "$REPO" config user.name "github-actions[bot]"
          git -C "$REPO" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$REPO" add mrms/HeroDirt_MRMS_hourly.npz

          if git -C "$REPO" diff --cached --quiet; then
            echo "No MRMS changes to save."
          else
            git -C "$REPO" commit -m "Update MRMS hourly history"
            git -C "$REPO" push origin HEAD:mrms-history
          fi



      - name: Checkout persistent soil state
        uses: actions/checkout@v4
        with:
          ref: soil-state
          path: soil-state
          persist-credentials: true

      - name: Restore analyzed soil state
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/soil-state/restart/HeroDirt_analysis_restart.npz"
          DEST="$HOME/HeroDirt/restart/HeroDirt_analysis_restart.npz"
          test -s "$SRC"
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          echo "Restored analyzed state:"
          ls -lh "$DEST"

      - name: Download SMAP
        run: python "$HOME/HeroDirt/src/get_smap.py"

      - name: Download NWS forecast
        run: python "$HOME/HeroDirt/src/get_nws.py"

      - name: Check forcing
        run: python "$HOME/HeroDirt/src/check_forcing.py"

      - name: Run soil model
        run: python "$HOME/HeroDirt/src/run_soil_model_v2.py"

      - name: Generate trail map
        run: python "$HOME/HeroDirt/src/build_trail_map.py"

      - name: Generate Explorer
        run: python "$HOME/HeroDirt/src/build_explorer_map.py"

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/HeroDirt"

          test -s "$ROOT/output/current_v2_beta/HeroDirt_current_state.npz"
          test -s "$ROOT/output/forecast_v2_beta/HeroDirt_forecast_6hourly.npz"
          test -s "$ROOT/web/HeroDirt_trails.html"
          test -s "$ROOT/web/HeroDirt_explorer.html"

          cp "$ROOT/web/HeroDirt_trails.html" "$ROOT/web/index.html"

          test -s "$ROOT/web/data/trails_now.geojson"
          test -s "$ROOT/web/data/trails_plus120.geojson"

          touch "$ROOT/web/.nojekyll"


      - name: Save persistent analyzed soil state
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE/soil-state"
          SOURCE="$HOME/HeroDirt/restart/HeroDirt_analysis_restart.npz"
          DEST="$REPO/restart/HeroDirt_analysis_restart.npz"
          test -s "$SOURCE"
          test -s "$DEST"

          python - "$SOURCE" "$DEST" <<'PYVALIDATE'
          import sys
          import numpy as np
          with np.load(sys.argv[1], allow_pickle=False) as new, np.load(sys.argv[2], allow_pickle=False) as old:
              keys = ('time', 'x', 'y', 'tread_theta', 'shallow_theta', 'physical_deep_theta')
              assert all(k in new and k in old for k in keys), 'Restart missing keys'
              assert np.array_equal(new['x'], old['x']) and np.array_equal(new['y'], old['y']), 'Restart grid changed'
              before = np.asarray(old['time']).astype('datetime64[s]')[()]
              after = np.asarray(new['time']).astype('datetime64[s]')[()]
              assert after > before, f'Restart must advance: {before} -> {after}'
              shape = (len(new['y']), len(new['x']))
              masks = []
              for k in keys[3:]:
                  assert new[k].shape == shape, f'Invalid shape for {k}'
                  mask = np.isfinite(new[k])
                  assert mask.any(), f'No modeled cells for {k}'
                  assert np.all(np.isnan(new[k][~mask])), f'Invalid masked cells in {k}'
                  assert np.all((new[k][mask] >= 0) & (new[k][mask] <= 1)), f'Invalid soil moisture in {k}'
                  masks.append(mask)
              assert all(np.array_equal(masks[0], m) for m in masks[1:]), 'Soil moisture masks disagree'
              print('Validated soil state:', before, '->', after)
          PYVALIDATE

          cp "$SOURCE" "$DEST"
          git -C "$REPO" config user.name "github-actions[bot]"
          git -C "$REPO" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$REPO" add restart/HeroDirt_analysis_restart.npz
          git -C "$REPO" commit -m "Advance analyzed soil state"
          git -C "$REPO" push origin HEAD:soil-state

      - name: Archive model analysis and forecast
        uses: actions/upload-artifact@v4
        with:
          name: herodirt-forecast-${{ github.run_id }}
          path: |
            ~/HeroDirt/output/current_v2_beta/HeroDirt_current_state.npz
            ~/HeroDirt/output/forecast_v2_beta/HeroDirt_forecast_6hourly.npz
          retention-days: 30
          compression-level: 1
          if-no-files-found: error

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/HeroDirt"
          SITE="$RUNNER_TEMP/herodirt-site"

          mkdir -p "$SITE/data"

          cp "$ROOT/web/index.html" "$SITE/"
          cp "$ROOT/web/HeroDirt_trails.html" "$SITE/"
          cp "$ROOT/web/HeroDirt_explorer.html" "$SITE/explorer.html"
          cp "$ROOT/web/HeroDirt_explorer.html" "$SITE/HeroDirt_explorer.html"
          cp "$ROOT/web/data/"*.geojson "$SITE/data/"
          touch "$SITE/.nojekyll"

          echo "Published files:"
          du -sh "$SITE"
          ls -lh "$SITE"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/herodirt-site

  deploy:
    needs: forecast
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

